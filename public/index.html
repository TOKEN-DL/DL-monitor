<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL-monitor · AI 热点雷达</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="grid-bg"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="radar-icon" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
        <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
        <circle cx="50" cy="50" r="18" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <line x1="50" y1="50" x2="50" y2="4" stroke="currentColor" stroke-width="1.5" class="radar-sweep"/>
      </svg>
      <div>
        <h1>DL-monitor</h1>
        <p class="subtitle">AI 热点雷达 · 走在吃瓜第一线</p>
      </div>
    </div>
    <div class="status-strip">
      <div class="status-item" id="ws-status">
        <span class="dot"></span><span class="label">WS</span>
      </div>
      <div class="status-item" id="push-status">
        <span class="dot"></span><span class="label">PUSH</span>
      </div>
      <div class="status-item" id="ai-status">
        <span class="dot"></span><span class="label">AI</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- 左：关键词 -->
    <aside class="panel left-panel">
      <div class="panel-header">
        <h2>// 监控关键词</h2>
        <span class="badge" id="kw-count">0</span>
      </div>
      <form id="kw-form" class="kw-input">
        <input type="text" id="kw-text" placeholder="输入关键词，如 Claude、GPT-5" autocomplete="off" required>
        <select id="kw-category">
          <option value="general">通用</option>
          <option value="model">大模型</option>
          <option value="tool">工具</option>
          <option value="paper">论文</option>
          <option value="news">新闻</option>
        </select>
        <button type="submit">＋ 添加</button>
      </form>
      <ul class="kw-list" id="kw-list"></ul>

      <div class="panel-header" style="margin-top:24px;">
        <h2>// 数据源</h2>
      </div>
      <ul class="source-list" id="source-list"></ul>
    </aside>

    <!-- 中：实时热点流 -->
    <section class="panel center-panel">
      <div class="panel-header">
        <h2>// 实时热点流</h2>
        <div class="filters">
          <select id="filter-source">
            <option value="">全部来源</option>
            <option value="hackernews">HackerNews</option>
            <option value="github">GitHub</option>
            <option value="huggingface">HuggingFace</option>
            <option value="arxiv">arXiv</option>
            <option value="twitter">X</option>
          </select>
          <input type="search" id="filter-keyword" placeholder="按关键词过滤">
          <button id="refresh-btn" title="立即抓取一次">⟳ 抓取</button>
        </div>
      </div>
      <div class="hotspot-stream" id="hotspots"></div>
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 200 200" width="120" height="120">
          <circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
          <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
          <circle cx="100" cy="100" r="30" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
          <circle cx="100" cy="100" r="6" fill="currentColor" class="pulse"/>
        </svg>
        <p>等待信号…<br><span class="hint">添加关键词后开始扫描</span></p>
      </div>
    </section>

    <!-- 右：通知 + 设置 -->
    <aside class="panel right-panel">
      <div class="panel-header">
        <h2>// 通知</h2>
      </div>
      <button class="cta-btn" id="enable-push">
        <span class="cta-icon">🔔</span>
        <span>启用浏览器推送</span>
      </button>
      <p class="hint">点击申请系统通知权限，重要热点将推送</p>

      <div class="panel-header" style="margin-top:24px;">
        <h2>// 配置状态</h2>
      </div>
      <ul class="config-list" id="config-list"></ul>

      <div class="panel-header" style="margin-top:24px;">
        <h2>// 数据源心跳</h2>
      </div>
      <ul class="heartbeat-list" id="heartbeat-list"></ul>
    </aside>
  </main>

  <div class="toast-container" id="toasts"></div>

  <template id="hotspot-tpl">
    <article class="hotspot-card">
      <div class="card-pulse"></div>
      <div class="card-body">
        <div class="card-meta">
          <span class="source-tag"></span>
          <span class="importance-bar"><span class="bar-fill"></span></span>
          <span class="importance-num"></span>
        </div>
        <h3 class="card-title"></h3>
        <p class="card-summary"></p>
        <div class="card-keywords"></div>
        <div class="card-footer">
          <time class="card-time"></time>
          <a class="card-link" target="_blank" rel="noopener">查看原文 →</a>
        </div>
      </div>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
